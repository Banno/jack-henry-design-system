name: Version
on:
  push:
    branches: 
      - next
      - 'release/v*' # Matches release/v3, release/v4, etc.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  version:
    permissions:
      contents: write
      pull-requests: write
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch all history for all branches and tags - Needed for Changsets to generate changelogs with commits
          fetch-depth: 0
          
      - name: Install dependencies
        uses: ./.github/workflows/actions/install-dependencies
      
      - name: Create version PR
        id: changesets
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "Version Packages (${{ github.ref_name }})"
          commit: "chore(release): version packages (${{ github.ref_name }})"
          version: "pnpm run changeset:version"