name: Forge metrics
on:
  schedule:
    # 08:30 America/Chicago is 13:30/14:30 UTC depending on DST; 14:00 UTC is close enough
    # for a monthly number. Runs on days 1–7; the first step skips unless it's Monday.
    - cron: "0 14 1-7 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and print without writing to Notion"
        type: boolean
        default: false

concurrency:
  group: forge-metrics
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and write to Notion
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Only run on the first Monday (scheduled runs)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Collect
        if: steps.gate.outputs.skip != 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          METRICS_GH_TOKEN: ${{ secrets.METRICS_GH_TOKEN }}
        run: |
          node scripts/metrics/collect.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
