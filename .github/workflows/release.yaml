name: Release
on:
  push:
    branches: [main] # Adjust branch name as needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}  
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write # git tags + GitHub releases
      pull-requests: write
      id-token: write #OIDC trusted publisher
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch all history for all branches and tags - Needed for Changsets to generate changelogs with commit
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/workflows/actions/install-dependencies

      - name: Build
        run: pnpm -r build

      - name: Publish Packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run changeset:release
          createGithubReleases: true
